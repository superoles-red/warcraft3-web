<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080705">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="loading.css">
<title>Warcraft III</title>
</head>
<body>
<main id="chooser" hidden>
  <p><label for="file">Выберите игровой ZIP Warcraft III. Браузер сохранит игру на этом устройстве.</label></p>
  <input id="file" type="file" accept=".zip,application/zip">
  <p id="message" role="status"></p>
  <p><a id="launch" href="engine/" hidden>Вернуться в игру</a></p>
  <button id="retry" hidden>Повторить загрузку</button>
</main>
<script src="loading.js"></script><script src="pack.js"></script><script src="app.js"></script>
</body></html>
